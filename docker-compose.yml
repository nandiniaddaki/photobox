# For running Postgres + Redis on your own laptop later (optional).
# Start:  docker compose up -d     then run PhotoApp.java from IntelliJ
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: photos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
