# ---------- Server ----------
# Render gives the port in the PORT env variable; locally we use 8080
server.port=${PORT:8080}

# ---------- PostgreSQL (the "source of truth") ----------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:photos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5

# Run schema.sql on every start (it uses CREATE TABLE IF NOT EXISTS, so it's safe)
spring.sql.init.mode=always

# ---------- Redis (cache + rate limiter) ----------
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
# If Redis is down, give up quickly and fall back to the DB
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=2s

# ---------- Upload limits ----------
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.tomcat.max-swallow-size=-1

# ---------- Our own settings (system design knobs - change and experiment!) ----------
# How long the feed stays in the cache (seconds)
app.cache.feed-ttl-seconds=${FEED_TTL_SECONDS:60}
# Fake "heavy query" delay so you can SEE the cache difference (ms)
app.db.slow-query-ms=${SLOW_DB_MS:300}
# Rate limit: max uploads per user per window
app.rate-limit.max-uploads=${RATE_LIMIT_MAX:5}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW:60}
# Total photos allowed (free database is small)
app.max-photos=${MAX_PHOTOS:60}
